# Nginx — design6.pentasecurity.com 앞단(HTTPS 종단) → Next(app:3000) + MinIO(minio:9000)
# 컨테이너 design5-nginx 의 /etc/nginx/conf.d/default.conf 로 바인드 마운트됨.
#
# ⚠️ MinIO 로 가는 모든 location 은 반드시 `proxy_set_header Host $host;` 여야 함.
#    presigned URL(업로드 PUT·표시 GET)은 공개 호스트(design6...)로 SigV4 서명되는데, SigV4 는
#    Host 를 서명에 포함한다. Host 를 `minio:9000` 등으로 덮어쓰면 MinIO 가 다른 Host 로 서명을
#    재계산해 **SignatureDoesNotMatch** 가 난다(공개 GET 이미지는 영향 없어 "표시는 되는데 업로드만 실패").
#    상세: docs/REFACTORING_HANDOFF.md §2.8.
# ⚠️ 서명되는 경로(/posts/ 업로드, /edms/ 표시)는 `proxy_pass http://minio:9000;`(뒤 경로 없이)로
#    원본 URI 를 보존해야 한다(뒤 경로가 붙으면 한글/인코딩 파일명에서 URI 재인코딩으로 서명이 깨질 수 있음).
# ⚠️ 이 파일은 단일 파일 바인드 마운트라, sed -i 등으로 고치면 inode 가 바뀌어 컨테이너가 옛 내용을
#    계속 본다. 수정 후 `docker restart design5-nginx` 로 마운트를 재연결할 것.

server {
    listen 80;
    server_name design6.pentasecurity.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name design6.pentasecurity.com;
    client_max_body_size 500m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── MinIO: posts 버킷 (presigned 업로드 PUT·표시 GET) ─────────────────
    # 뒤 경로 없이 원본 URI(/posts/...) 그대로 전달 → 서명 보존
    location /posts/ {
        proxy_pass         http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /thumbnails/ {
        proxy_pass         http://minio:9000/posts/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MinIO: 전용 버킷들 ────────────────────────────────────────────────
    location /avatars/ {
        proxy_pass         http://minio:9000/avatars/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /icons/ {
        proxy_pass         http://minio:9000/icons/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ppt-thumbnails/ {
        proxy_pass         http://minio:9000/ppt-thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MinIO: edms 버킷 (eDM 표시 GET) ──────────────────────────────────
    location /edms/ {
        proxy_pass         http://minio:9000/edms/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MinIO: slug 기반 경로 (파일 확장자 있을 때만 MinIO로, 없으면 Next.js로) ──
    location ~* ^/(penta-design|ci-bi|wapples|ppt|design-request|damo|icon|character|welcome-board|isign|card|diagram|cloudbric|card-thumbnails|categories|notices)/(.+\..+)$ {
        proxy_pass         http://minio:9000/posts/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /wallpaper/thumbnails/ {
        proxy_pass         http://minio:9000/posts/wallpaper/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /diagrams/thumbnails/ {
        proxy_pass         http://minio:9000/posts/diagrams/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /diagrams/zip/ {
        proxy_pass         http://minio:9000/posts/diagrams/zip/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js 앱 ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
