# 사내망 데이터 평면: PostgreSQL 17 + MinIO (S3 호환)
# 사용: deploy/rocky/.env 를 준비한 뒤 이 디렉터리에서
#   docker compose --env-file .env up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: design5-postgres
    networks:
      - design5-net
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: design5-minio
    networks:
      - design5-net
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${HOST_BIND:-127.0.0.1}:9000:9000"
      - "${HOST_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - ${DATA_ROOT}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: design5-minio-init
    networks:
      - design5-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/posts;
      mc mb --ignore-existing myminio/edms;
      mc mb --ignore-existing myminio/avatars;
      mc mb --ignore-existing myminio/icons;
      mc mb --ignore-existing myminio/ppt-thumbnails;
      mc anonymous set public myminio/posts;
      mc anonymous set public myminio/edms;
      mc anonymous set public myminio/avatars;
      mc anonymous set public myminio/icons;
      mc anonymous set public myminio/ppt-thumbnails;
      exit 0;
      "

# 네트워크 정의 추가
networks:
  design5-net:
    external: true
